[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-engine"
version = "0.1.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "streamlit>=1.30.0",
    "groq>=0.4.2",
    "plotly>=5.18.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: marks tests that query external network/provider endpoints",
]
